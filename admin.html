<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Akirma Events PLC</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#059669" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ══════════ LOGIN ══════════ -->
  <div class="admin-login" id="admin-login">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo.png" alt="Akirma Events logo" />
      </div>
      <h1 class="login-title">Akirma Admin</h1>
      <p class="login-sub" id="login-sub">Sign in to manage inquiries &amp; subscribers.</p>

      <!-- Firebase email/password -->
      <form id="login-form-fb" class="login-form" style="display:none" autocomplete="on">
        <div class="form-field">
          <label for="admin-email">Email</label>
          <input class="form-input" type="email" id="admin-email" placeholder="admin@akirma.com" required autocomplete="username" />
        </div>
        <div class="form-field">
          <label for="admin-pass">Password</label>
          <input class="form-input" type="password" id="admin-pass" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg login-btn" id="admin-login-btn">Sign In</button>
      </form>

      <!-- PIN sign-in (server mode) / preview (no site API) -->
      <form id="login-form-demo" class="login-form" style="display:none" autocomplete="off">
        <div class="form-field">
          <label for="admin-pin">Admin PIN</label>
          <input class="form-input" type="password" id="admin-pin" inputmode="numeric" placeholder="••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-lg login-btn" id="demo-login-btn">Sign In</button>
        <p class="login-hint">Your PIN is verified on the server — it is never stored in this page's code. Sessions last 8 hours and sign out clears them.</p>
      </form>

      <p class="login-error" id="login-error" style="display:none"></p>
      <a class="login-back" href="index.html">&larr; Back to website</a>
    </div>
  </div>

  <!-- ══════════ DASHBOARD ══════════ -->
  <div class="admin-app" id="admin-app" style="display:none">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sb-brand">
        <img src="logo.png" alt="" />
        <div>
          <strong>Akirma</strong>
          <span>Admin Panel</span>
        </div>
      </div>
      <nav class="sb-nav" aria-label="Admin sections">
        <button class="sb-link active" data-view="overview" id="nav-overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
          <span>Overview</span>
        </button>
        <button class="sb-link" data-view="inquiries" id="nav-inquiries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>
          <span>Inquiries</span>
          <em class="sb-badge" id="badge-new" style="display:none">0</em>
        </button>
        <button class="sb-link" data-view="subscribers" id="nav-subscribers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 9v.906a2.25 2.25 0 0 1-1.183 1.981l-6.478 3.488M2.25 9v.906m0 0a2.25 2.25 0 0 0 1.183 1.981l6.478 3.488M2.25 9.75 12 4.5l9.75 5.25m-9.75 0v11.25" /></svg>
          <span>Subscribers</span>
        </button>
        <button class="sb-link" data-view="content" id="nav-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487 18.549 2.8a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /></svg>
          <span>Content</span>
          <em class="sb-badge" id="badge-content" style="display:none">•</em>
        </button>
        <button class="sb-link" data-view="settings" id="nav-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="sb-footer">
        <div class="mode-chip" id="mode-chip">DEMO</div>
        <button class="sb-link sb-logout" id="btn-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" /></svg>
          <span>Log out</span>
        </button>
      </div>
    </aside>
    <div class="sb-scrim" id="sb-scrim"></div>

    <!-- Main -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="hamburger admin-burger" id="sb-burger" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
        <h2 class="topbar-title" id="topbar-title">Overview</h2>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-refresh" title="Refresh data" aria-label="Refresh data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
          </button>
          <button class="icon-btn" id="btn-theme" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" /></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" /></svg>
          </button>
        </div>
      </header>

      <div class="admin-content" id="admin-content">
        <!-- Views are rendered here by js/admin.js -->
      </div>
    </main>
  </div>

  <!-- Detail drawer for an inquiry -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="inquiry-drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>Inquiry details</h3>
      <button class="icon-btn" id="drawer-close" aria-label="Close details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
<script src="js/site-overrides.js"></script>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
